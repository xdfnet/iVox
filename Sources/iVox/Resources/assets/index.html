<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="iVox Remote">
    <meta name="theme-color" content="#000000">
    <title>iVox Remote</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            position: fixed;
            width: 100%;
            height: 100%;
            overscroll-behavior: none;
            background: #000000;
            background-image: linear-gradient(180deg, #1c1c1e 0%, #000000 100%);
            background-attachment: fixed;
        }

        body {
            position: absolute;
            inset: 0;
            overscroll-behavior: none;
            margin: 0;
            /* 顶部留出刘海区，内容在「扣掉刘海与底部手势条」之后的区域里上下居中。
               max() 是兜底：万一 env() 在某些 iOS 版本上返回 0（表现为内容整体往上挤），
               至少还留 44px，不会把控件顶到刘海底下。 */
            padding-top: max(env(safe-area-inset-top), 44px);
            padding-bottom: max(env(safe-area-inset-bottom, 0px), 16px);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            background: transparent;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* 统一焦点环：所有可聚焦控件都要有清晰可见的焦点态 */
        button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 24px 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 34px;
        }

        /* ---------- 触控反馈：统一按压缩放，所有按压态一致 ---------- */
        button:active {
            transform: scale(.94);
            opacity: .8;
        }

        button {
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            background: none;
            color: inherit;
            font: inherit;
            border-radius: 50%;
            touch-action: manipulation;
            transition: background .15s cubic-bezier(.4, 0, .2, 1),
                        transform .15s cubic-bezier(.4, 0, .2, 1),
                        box-shadow .15s cubic-bezier(.4, 0, .2, 1);
        }

        /* ---------- 滑动解锁（老 iPhone 那样）---------- */
        .slide-row {
            position: relative;
            width: 100%;
            max-width: 360px;
            height: 78px;
            margin: 0 auto 14px;
            border-radius: 39px;
            background: rgba(255, 255, 255, .07);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1);
            overflow: hidden;
        }

        .slide-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, .5);
            font-size: 15px;
            letter-spacing: 3px;
            pointer-events: none;
        }

        .slide-knob {
            position: absolute;
            left: 2px;
            top: 2px;
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8e8e93;
            cursor: grab;
            touch-action: none;          /* 手指拖动时别让页面跟着滚 */
            user-select: none;
            transition: transform .2s cubic-bezier(.4, 0, .2, 1);
        }

        .slide-row.dragging .slide-knob { transition: none; cursor: grabbing; }
        .slide-row.busy { opacity: .5; pointer-events: none; }

        /* ---------- App 快捷方式 ---------- */
        .app-shortcuts {
            display: flex;
            justify-content: center;
            gap: 28px;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 19px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .3), inset 0 0 0 1px rgba(255, 255, 255, .08);
            background: rgba(255, 255, 255, .05);
            overflow: hidden;
        }

        .app-icon:hover { background: rgba(255, 255, 255, .1); }
        .app-icon:active {
            transform: scale(.9);
            box-shadow: 0 2px 8px rgba(0, 0, 0, .4);
        }
        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ---------- 音量 ---------- */
        .volume-row {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, .3);
            padding: 16px 20px;
            border-radius: 22px;
            gap: 18px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
        }

        .volume-row button {
            width: 70px;
            height: 70px;
        }

        /* ---------- 媒体控制 ---------- */
        .navigation {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .media-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        /* 深底上的次级圆键：小幅度提亮表面 + 一圈内边线，保证辨识度 */
        .track, .arrow, .volume-row button {
            background: rgba(255, 255, 255, .16);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
        }
        .track:hover, .arrow:hover, .volume-row button:hover {
            background: rgba(255, 255, 255, .24);
        }

        .play {
            width: 108px;
            height: 108px;
            background: #fff;
            color: #000;
            box-shadow: 0 6px 24px rgba(255, 255, 255, .4);
        }
        .play:hover { background: rgba(255, 255, 255, .9); }
        .play:active {
            transform: scale(.94);
            background: rgba(255, 255, 255, .85);
        }

        .track { width: 78px; height: 78px; }
        .arrow { width: 78px; height: 78px; }

        svg {
            fill: currentColor;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .25));
        }

        .toast {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 20px) + 20px);
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            background: rgba(60, 60, 67, .75);
            color: rgba(255, 255, 255, .85);
            border-radius: 20px;
            opacity: 0;
            transition: opacity .25s ease;
            z-index: 1000;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, .3);
            pointer-events: none;
        }

        .toast.show { opacity: 1; }
        .toast.error { background: rgba(255, 69, 58, .75); }

        /* ---------- 平板（iPad mini 竖屏 ~768pt）：更大的余白与主区分布，
           避免小按钮漂浮在空旷背景中央 ---------- */
        @media (min-width: 700px) {
            .container {
                max-width: 640px;
                padding: 40px 32px;
                gap: 52px;
                justify-content: space-evenly;
                min-height: 100%;
            }

            .app-icon { width: 92px; height: 92px; border-radius: 22px; }
            .app-shortcuts { gap: 36px; }

            .volume-row { padding: 20px 26px; gap: 24px; border-radius: 26px; }
            .volume-row button { width: 80px; height: 80px; }

            .slide-row { max-width: 420px; height: 88px; border-radius: 44px; }
            .slide-knob { width: 84px; height: 84px; }

            .track, .arrow { width: 88px; height: 88px; }
            .navigation { gap: 22px; }
            .media-row { gap: 18px; }
            .play { width: 118px; height: 118px; }

        }
    </style>
</head>

<body>
    <div id="toast" class="toast">已发送</div>
    <main class="container">

        <!-- 锁屏 / 解锁：一个滑块，两个方向（右滑锁定，左滑解锁），老 iPhone 那样 -->
        <div class="slide-row" id="slideLock">
            <div class="slide-hint" id="slideHint">右滑锁定屏幕</div>
            <div class="slide-knob" role="button" aria-label="滑动锁定或解锁屏幕">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                </svg>
            </div>
        </div>

        <!-- App 快捷方式 -->
        <div class="app-shortcuts">
            <button class="app-icon" onclick="send('toggle_douyin')" aria-label="打开或关闭抖音">
                <img src="/assets/douyin.png" alt="抖音" width="80" height="80">
            </button>
            <button class="app-icon" onclick="send('toggle_qishui')" aria-label="打开或关闭汽水音乐">
                <img src="/assets/qishui.png" alt="汽水音乐" width="80" height="80">
            </button>
        </div>

        <!-- 音量 -->
        <div class="volume-row">
            <button onclick="send('volumedown')" aria-label="减小音量"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg></button>
            <button onclick="send('mute')" aria-label="静音"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg></button>
            <button onclick="send('volumeup')" aria-label="增加音量"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
        </div>

        <!-- 媒体控制 -->
        <div class="navigation">
            <button class="arrow" onclick="send('arrowup')" aria-label="向上"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg></button>
            <div class="media-row">
                <button class="track" onclick="send('prev')" aria-label="上一曲"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button class="play" onclick="send('playpause')" aria-label="播放或暂停"><svg width="44" height="44" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
                <button class="track" onclick="send('next')" aria-label="下一曲"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
            </div>
            <button class="arrow" onclick="send('arrowdown')" aria-label="向下"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></button>
        </div>

    </main>
    <script>
        let t;
        const okStatuses = new Set(['playing', 'paused', 'success', 'lock_success', 'opened', 'closed', 'running', 'stopped', 'locked', 'unlocked']);

        async function send(a) {
            if (navigator.vibrate) navigator.vibrate(10);
            show('发送中...');
            try {
                const r = await fetch('/api/' + a);
                const d = await r.json();
                const ok = okStatuses.has(d.status);
                show(ok ? '成功' : '失败', !ok);
            } catch (e) { show('错误', true) }
        }

        // 锁屏 / 解锁：一个滑块，两个方向。**滑块的位置就是锁屏状态**——
        // 右边=已锁定，左边=没锁。往右拖到底=锁定，往左拖到底=解锁，中间松手就弹回去。
        // 指针事件一套覆盖鼠标与触摸（手机上就是手指拖）。
        (function () {
            const row = document.getElementById('slideLock');
            const knob = row.querySelector('.slide-knob');
            const hint = document.getElementById('slideHint');
            let locked = false;          // 当前屏幕是不是锁着的
            let dragging = false, startX = 0, startPos = 0, pos = 0;
            const maxOffset = () => row.clientWidth - knob.offsetWidth - 8;

            function apply() {
                knob.style.transform = 'translateX(' + pos + 'px)';
            }

            function setLocked(v) {
                locked = v;
                pos = v ? maxOffset() : 0;
                apply();
                hint.textContent = v ? '左滑解锁' : '右滑锁定屏幕';
            }

            knob.addEventListener('pointerdown', e => {
                dragging = true;
                startX = e.clientX;
                startPos = pos;
                knob.setPointerCapture(e.pointerId);
                row.classList.add('dragging');
            });
            knob.addEventListener('pointermove', e => {
                if (!dragging) return;
                pos = Math.max(0, Math.min(maxOffset(), startPos + (e.clientX - startX)));
                apply();
            });
            knob.addEventListener('pointerup', () => {
                if (!dragging) return;
                dragging = false;
                row.classList.remove('dragging');
                const max = maxOffset();
                if (pos >= max - 8 && !locked) {
                    setLocked(true);
                    act('/api/lock', '已锁定', '锁定失败');
                } else if (pos <= 8 && locked) {
                    setLocked(false);
                    act('/api/unlock', '已解锁', '解锁失败');
                } else {
                    setLocked(locked);   // 没到头：弹回原位
                }
            });

            async function act(url, okText, failText) {
                row.classList.add('busy');
                show(okText === '已解锁' ? '解锁中...' : '锁定中...');
                try {
                    const r = await fetch(url);
                    const d = await r.json();
                    const ok = d.status === 'lock_success' || d.status === 'unlock_success';
                    if (!ok) {
                        setLocked(!locked);          // 失败了就把滑块拨回去
                        show(failText + '：' + (d.error || '未知原因'), true);
                    } else {
                        show(okText);
                    }
                } catch (e) {
                    setLocked(!locked);
                    show('错误', true);
                } finally {
                    row.classList.remove('busy');
                }
            }

            // 开页面先问一次当前状态：锁着就从右边起滑，没锁就从左边起滑
            fetch('/api/lock_status')
                .then(r => r.json())
                .then(d => setLocked(d.status === 'locked'))
                .catch(() => {});
        })();

        function show(m, e) {
            const el = document.getElementById('toast');
            el.textContent = m;
            el.className = e ? 'toast error show' : 'toast show';
            clearTimeout(t);
            t = setTimeout(() => el.className = e ? 'toast error' : 'toast', 2000);
        }
    </script>
</body>

</html>
